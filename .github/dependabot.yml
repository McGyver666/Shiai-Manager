version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Angular packages must move in lockstep; majors go through `ng update` instead.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "typescript"
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "typescript"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@angular/*"
        update-types:
          - version-update:semver-major
      # TypeScript majors are gated by the @angular/build peer range.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.x requires Microsoft.OpenApi < 3.0.
      - dependency-name: "Microsoft.OpenApi"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
