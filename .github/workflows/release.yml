name: Build and package release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# A tagged build also creates a GitHub Release. All other builds retain the
# package as a workflow artifact.
permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Full history and tags are required so the build can derive the
          # version from the most recent tag.
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Tagged release: use the tag verbatim without the leading 'v'.
            version="${GITHUB_REF_NAME#v}"
          else
            # Untagged build: most recent tag plus the build number, no commit SHA.
            last_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
            version="${last_tag#v}+build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      - name: Inject frontend version
        shell: bash
        run: |
          cat > frontend/src/app/core/app-version.generated.ts <<EOF
          // Generated at build time by the release workflow (.github/workflows/release.yml).
          // The committed value is a local-development placeholder and is overwritten before
          // each release build. Do not rely on it to identify a deployed release.
          export const GENERATED_APP_VERSION = '${{ steps.version.outputs.version }}';
          EOF

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Restore .NET dependencies
        run: dotnet restore JudoTournamentManagement.Api/JudoTournamentManagement.Api.csproj

      - name: Build deployable application
        run: dotnet build JudoTournamentManagement.Api/JudoTournamentManagement.Api.csproj --configuration Release --no-restore

      - name: Create Linux release folder
        shell: bash
        run: |
          rm -rf release release.zip
          mkdir -p release/app/App_Data release/deploy

          dotnet publish JudoTournamentManagement.Api/JudoTournamentManagement.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output release/app \
            -p:UseAppHost=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="${{ steps.version.outputs.version }}"

          # Runtime data is deliberately empty; do not ship the repository's
          # development certificate or any local SQLite database.
          rm -rf release/app/App_Data
          mkdir -p release/app/App_Data
          find release/app -name '*.pdb' -delete
          cp deploy/judo-tournament-release.service release/deploy/judo-tournament.service
          cp deploy/judo-tournament.nginx.conf release/deploy/judo-tournament.nginx.conf
          cp deploy/install_release.sh release/deploy/install_release.sh
          cp deploy/release-README.md release/README.md
          chmod +x release/app/JudoTournamentManagement.Api
          chmod +x release/deploy/install_release.sh

      - name: Create release archive
        run: zip -r release.zip release

      - name: Create release checksum
        run: sha256sum release.zip > release.zip.sha256

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: judo-tournament-linux-release
          path: |
            release/
            release.zip
            release.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release may already exist (e.g. created via the GitHub UI, which
          # also pushes the tag that triggers this workflow). Upload the assets
          # to the existing release in that case; otherwise create a new one.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release.zip release.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" release.zip release.zip.sha256 --title "$GITHUB_REF_NAME" --generate-notes
          fi
